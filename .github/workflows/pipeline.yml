name: Pipeline Backend Wuepa

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion
        run: npm run build

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: backend-wuepa-dist
          path: dist
          if-no-files-found: error
